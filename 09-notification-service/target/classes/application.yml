spring:
  application:
    name: notification-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:YOUR_DATABASE_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:notificationdb}
    username: ${POSTGRES_USER:YOUR_DATABASE_USER}
    password: ${POSTGRES_PASSWORD:YOUR_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 16
      pool-name: pulsesend-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  sql:
    init:
      mode: always
      continue-on-error: false

  rabbitmq:
    host: ${RABBITMQ_HOST:YOUR_RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:YOUR_RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD:YOUR_RABBITMQ_PASSWORD}
    listener:
      simple:
        concurrency: 1
        max-concurrency: 2
        prefetch: 5

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

pulsesend:
  messaging:
    exchange: notifications.exchange
    dead-letter-exchange: notifications.dlx
    email-queue: notifications.email
    sms-queue: notifications.sms
    in-app-queue: notifications.inapp
    dead-letter-queue: notifications.dlq
    routing-prefix: notify
  delivery:
    max-attempts: 5

logging:
  level:
    com.pulsesend.notifications: DEBUG
    org.hibernate.SQL: DEBUG
