spring:
  application:
    name: food-ordering-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:YOUR_DATABASE_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:fooddb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:YOUR_DATABASE_USER}
    password: ${MYSQL_PASSWORD:YOUR_DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 12
      pool-name: spicebox-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  sql:
    init:
      mode: always
      continue-on-error: false

  rabbitmq:
    host: ${RABBITMQ_HOST:YOUR_RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:YOUR_RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD:YOUR_RABBITMQ_PASSWORD}
    listener:
      simple:
        default-requeue-rejected: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

spicebox:
  messaging:
    exchange: food.orders
    placed-routing-key: order.placed
    ready-routing-key: order.ready-for-pickup
    analytics-queue: analytics.orders
    dispatch-queue: delivery.dispatch
  ordering:
    delivery-fee: 39.00
    free-delivery-threshold: 499.00
    minimum-order-value: 99.00

logging:
  level:
    com.spicebox.ordering: DEBUG
    org.hibernate.SQL: DEBUG
