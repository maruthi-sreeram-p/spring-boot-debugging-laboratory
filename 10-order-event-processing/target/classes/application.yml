spring:
  application:
    name: order-event-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:YOUR_DATABASE_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:ordereventsdb}
    username: ${POSTGRES_USER:YOUR_DATABASE_USER}
    password: ${POSTGRES_PASSWORD:YOUR_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 16
      pool-name: riverstone-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  sql:
    init:
      mode: always
      continue-on-error: false

  kafka:
    bootstrap-servers: ${KAFKA_BROKER:YOUR_KAFKA_BROKER}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.riverstone.orderevents.messaging
    listener:
      ack-mode: manual_immediate
      concurrency: 3

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

riverstone:
  topics:
    orders-created: orders.created
    inventory-events: inventory.events
    partitions: 3
  groups:
    inventory: inventory-service
    downstream: order-pipeline

logging:
  level:
    com.riverstone.orderevents: DEBUG
    org.hibernate.SQL: DEBUG
    org.apache.kafka: WARN
