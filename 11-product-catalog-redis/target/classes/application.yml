spring:
  application:
    name: product-catalog-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:YOUR_DATABASE_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:catalogdb}
    username: ${POSTGRES_USER:YOUR_DATABASE_USER}
    password: ${POSTGRES_PASSWORD:YOUR_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 16
      pool-name: catalog-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  sql:
    init:
      mode: always
      continue-on-error: false

  data:
    redis:
      host: ${REDIS_HOST:YOUR_REDIS_HOST}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  cache:
    type: redis

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,caches

lumen:
  cache:
    key-prefix: "catalog:"
    product-ttl-minutes: 30
    listing-ttl-minutes: 15
    search-ttl-minutes: 5

logging:
  level:
    com.lumen.catalog: DEBUG
    org.hibernate.SQL: DEBUG
