spring:
  application:
    name: job-portal-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:YOUR_DATABASE_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:jobportaldb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:YOUR_DATABASE_USER}
    password: ${MYSQL_PASSWORD:YOUR_DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 12
      pool-name: hirestack-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  sql:
    init:
      mode: always
      continue-on-error: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

hirestack:
  search:
    default-page-size: 20
    max-page-size: 50
  applications:
    max-open-per-candidate: 25

logging:
  level:
    com.hirestack.portal: DEBUG
    org.hibernate.SQL: DEBUG
