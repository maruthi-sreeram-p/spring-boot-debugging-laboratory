spring:
  datasource:
    url: jdbc:h2:mem:shoptest;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  sql:
    init:
      mode: never
  data:
    redis:
      host: localhost
      port: 6379

shop:
  cart:
    key-prefix: "shop:cart:"
    ttl-hours: 72
  pricing:
    free-shipping-threshold: 500.00
    standard-shipping-fee: 49.00

logging:
  level:
    org.hibernate.SQL: WARN
    com.northwind.shop: INFO
