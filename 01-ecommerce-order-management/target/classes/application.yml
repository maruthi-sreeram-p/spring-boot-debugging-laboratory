spring:
  application:
    name: shop-order-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:YOUR_DATABASE_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:shopdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:YOUR_DATABASE_USER}
    password: ${MYSQL_PASSWORD:YOUR_DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      pool-name: shop-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  sql:
    init:
      mode: always
      continue-on-error: false

  data:
    redis:
      host: ${REDIS_HOST:YOUR_REDIS_HOST}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  cache:
    type: redis

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,caches

shop:
  cart:
    key-prefix: "shop:cart:"
    ttl-hours: 72
  pricing:
    free-shipping-threshold: 500.00
    standard-shipping-fee: 49.00

logging:
  level:
    com.northwind.shop: DEBUG
    org.hibernate.SQL: DEBUG
