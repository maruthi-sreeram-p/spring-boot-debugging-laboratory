spring:
  application:
    name: payment-processing-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:YOUR_DATABASE_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:paymentsdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:YOUR_DATABASE_USER}
    password: ${MYSQL_PASSWORD:YOUR_DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 16
      pool-name: payments-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  sql:
    init:
      mode: always
      continue-on-error: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

payments:
  gateway:
    name: simulator
    slow-response-millis: 900
    approval-prefix: SIMGW
  retry:
    max-attempts: 3
    backoff-millis: 200
  reconciliation:
    stale-after-minutes: 5
    cron: "0 */2 * * * *"

logging:
  level:
    com.ledgerline.payments: DEBUG
    org.hibernate.SQL: DEBUG
