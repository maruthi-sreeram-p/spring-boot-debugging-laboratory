spring:
  datasource:
    url: jdbc:h2:mem:invtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  sql:
    init:
      mode: never
  data:
    redis:
      host: localhost
      port: 6380

inventory:
  cache:
    key-prefix: "inv:stock:"
    ttl-minutes: 15
  receiving:
    over-receipt-tolerance-percent: 0

logging:
  level:
    org.hibernate.SQL: WARN
    com.vantage.inventory: INFO
