spring:
  application:
    name: clinic-appointment-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:YOUR_DATABASE_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hospitaldb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: ${MYSQL_USER:YOUR_DATABASE_USER}
    password: ${MYSQL_PASSWORD:YOUR_DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      pool-name: clinic-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  sql:
    init:
      mode: always
      continue-on-error: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

clinic:
  timezone: Asia/Kolkata
  booking:
    minimum-notice-minutes: 30
    maximum-days-ahead: 60
  cancellation:
    minimum-notice-hours: 2
  no-show:
    grace-minutes: 20
    sweep-cron: "0 */5 * * * *"

logging:
  level:
    com.harbourview.clinic: DEBUG
    org.hibernate.SQL: DEBUG
