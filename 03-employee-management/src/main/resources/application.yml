spring:
  application:
    name: hr-directory-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:YOUR_DATABASE_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hrdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:YOUR_DATABASE_USER}
    password: ${MYSQL_PASSWORD:YOUR_DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      pool-name: hr-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        generate_statistics: false

  sql:
    init:
      mode: always
      continue-on-error: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

hr:
  directory:
    default-page-size: 20
    max-page-size: 100

logging:
  level:
    com.northgate.hr: DEBUG
    org.hibernate.SQL: DEBUG
