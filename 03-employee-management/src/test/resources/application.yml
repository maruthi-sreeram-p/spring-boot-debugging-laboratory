spring:
  datasource:
    url: jdbc:h2:mem:hrtest;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  sql:
    init:
      mode: never

hr:
  directory:
    default-page-size: 20
    max-page-size: 100

logging:
  level:
    org.hibernate.SQL: WARN
    com.northgate.hr: INFO
