spring:
  application:
    name: lending-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:YOUR_DATABASE_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:librarydb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:YOUR_DATABASE_USER}
    password: ${MYSQL_PASSWORD:YOUR_DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 24
      pool-name: circulation-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC

  sql:
    init:
      mode: always
      continue-on-error: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
  tomcat:
    threads:
      max: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info

athenaeum:
  circulation:
    standard-loan-days: 14
    premium-loan-days: 21
    staff-loan-days: 28
    standard-loan-limit: 4
    premium-loan-limit: 8
    staff-loan-limit: 12
    max-renewals: 2
    hold-shelf-hours: 48
  fines:
    daily-rate: 5.00
    maximum: 500.00
    accrual-cron: "0 0 2 * * *"

logging:
  level:
    com.athenaeum.lending: DEBUG
    org.hibernate.SQL: DEBUG
